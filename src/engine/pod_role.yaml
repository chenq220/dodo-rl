---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arksim-manager-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arksim-manager-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: Role
  name: arksim-manager-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arksim-manager-role
  namespace: dodo1
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arksim-manager-binding
  namespace: dodo1
subjects:
- kind: ServiceAccount
  name: default
  namespace: dodo1
roleRef:
  kind: Role
  name: arksim-manager-role
  apiGroup: rbac.authorization.k8s.io

